version: 2

models:
  - name: dim_team
    data_tests:
      - row_count_matches:
          expected_key: team_season_pairs
          config: {severity: error, tags: [dim_team]}
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, team_abbr]
          config: {severity: error, tags: [dim_team]}
      - assert_group_count:
          expected_key: teams
          arguments:
            group_by_column: season
          config: {severity: error, tags: [dim_team]}
    columns:
      - name: team_season_id
        data_tests:
          - not_null: {config: {severity: error, tags: [dim_team]}}
          - unique: {config: {severity: error, tags: [dim_team]}}
      - name: season
        data_tests:
          - not_null: {config: {severity: error, tags: [dim_team]}}
          - dbt_utils.accepted_range: {min_value: 2023, max_value: 2025, config: {severity: error, tags: [dim_team]}}
          